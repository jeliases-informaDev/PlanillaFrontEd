<div class="min-h-screen flex bg-gray-100">
  <aside class="w-56 bg-slate-900 text-slate-200 flex flex-col">
    <div class="px-5 py-5 text-lg font-bold text-white">Sistema de Planillas</div>
    <nav class="flex-1 px-2 space-y-1">
      @for (e of enlaces; track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="bg-slate-700 text-white"
           class="block rounded px-3 py-2 text-sm hover:bg-slate-800">{{ e.texto }}</a>
      }
      @if (esAdmin) {
        <div class="px-3 pt-4 pb-1 text-xs uppercase tracking-wide text-slate-500">Administración</div>
        @for (e of enlacesAdmin; track e.ruta) {
          <a [routerLink]="e.ruta" routerLinkActive="bg-slate-700 text-white"
             class="block rounded px-3 py-2 text-sm hover:bg-slate-800">{{ e.texto }}</a>
        }
      }
    </nav>
    <div class="px-4 py-4 text-xs text-slate-400 border-t border-slate-800">
      <div class="text-slate-200">{{ nombre }}</div>
      <div>{{ rol }}</div>
      <a routerLink="/cambiar-password" class="mt-2 block text-slate-400 hover:text-white hover:underline">Cambiar contraseña</a>
      <button type="button" (click)="salir()"
              class="mt-2 block w-full rounded bg-slate-800 px-3 py-2 text-left text-sm text-slate-200 hover:bg-slate-700">
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="flex items-center justify-end gap-3 bg-white px-6 py-3 shadow-sm">
      @if (!esAdmin) {
        <span class="rounded-full bg-gray-100 px-3 py-1 text-xs text-gray-600">Modo solo lectura</span>
      }
      <span class="inline-flex items-center gap-2 text-sm"
            [class.text-green-700]="realtime.conectado()" [class.text-amber-600]="!realtime.conectado()">
        <span class="h-2.5 w-2.5 rounded-full"
              [class.bg-green-500]="realtime.conectado()" [class.animate-pulse]="!realtime.conectado()"
              [class.bg-amber-500]="!realtime.conectado()"></span>
        {{ realtime.conectado() ? 'En vivo' : 'Reconectando…' }}
      </span>
    </header>
    <main class="flex-1 p-6 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
